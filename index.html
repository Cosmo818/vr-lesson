<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>VR-урок</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ov">
  <div class="card">
    <header>
      <h1>VR-урок</h1>
      <a class="link" href="teacher.html">Учителю →</a>
    </header>
    <p id="status" class="warn"></p>
    <p id="summary" class="ok" hidden></p>

    <section id="pick">
      <h2>Кто сейчас в шлеме?</h2>
      <div id="classes" class="chips"></div>
      <div id="list" class="grid"></div>
      <div class="row">
        <button id="addBtn" class="btn">+ Новый ученик</button>
        <button id="guestBtn" class="btn ghost">Гость</button>
      </div>
      <form id="addForm" class="row form" hidden>
        <input id="nm" maxlength="40" placeholder="Имя и фамилия" autocomplete="off">
        <select id="gr"></select>
        <button class="btn">Сохранить</button>
        <button type="button" id="cancelAdd" class="btn ghost">Отмена</button>
      </form>
    </section>

    <section id="ready" hidden>
      <h2 id="who"></h2>
      <p id="whoInfo" class="muted"></p>
      <p id="guestGrade" hidden><select id="gg"></select></p>
      <button id="go" class="btn big">Войти в VR</button>
      <p id="err" class="warn"></p>
      <button id="back" class="btn ghost">← Другой ученик</button>
    </section>

    <section id="fb" hidden>
      <h2>Отзыв или идея</h2>
      <div id="fbKind" class="chips">
        <button class="chip on" data-k="idea">Идея</button><button class="chip" data-k="bug">Нашёл ошибку</button><button class="chip" data-k="like">Понравилось</button><button class="chip" data-k="dislike">Не понравилось</button>
      </div>
      <div class="row form"><select id="fbRoom"></select></div>
      <div id="fbRate" class="chips" style="margin-top:10px"></div>
      <textarea id="fbText" maxlength="1000" placeholder="Что улучшить, что добавить, что не работает?" style="width:100%;min-height:110px;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0e1730;color:var(--text);font-size:17px"></textarea>
      <label id="fbSignL" class="muted small" hidden><input type="checkbox" id="fbSign"> подписать моим именем</label>
      <p class="muted small">Отзыв анонимный: сохраняются только текст, оценка и класс. Не пиши в отзыве фамилию, телефон или адрес.</p>
      <div class="row"><button id="fbSend" class="btn">Отправить</button><button id="fbCancel" class="btn ghost">Отмена</button><span id="fbMsg" class="ok"></span></div>
    </section>

    <p class="row"><button id="fbOpen" class="btn ghost">Оставить отзыв или идею</button></p>
    <p id="mode" class="muted small"></p>
    <p id="sync" class="muted small"></p>
  </div>
</div>

<div id="desk" hidden>
  <div id="deskHud"></div>
  <div id="cross"></div>
  <div id="deskHelp">Мышь (зажать) — осмотр · W A S D — ходьба · Щелчок или пробел — выбрать · E (держать) — взять · M — меню</div>
  <button id="deskExit" class="btn ghost">Завершить (Esc)</button>
</div>

<script src="js/data.js"></script>
<script src="js/questions.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/rooms.js"></script>
<script src="js/rooms2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
